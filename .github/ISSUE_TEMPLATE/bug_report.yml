name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "code_scout 1.3.0, code_scout_dio 1.0.1"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Android 14 on a Pixel 7, Flutter 3.x"
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: How you set it up
      description: Your init() call, with the project secret removed.
      render: dart
  - type: textarea
    id: output
    attributes:
      label: Console output
      render: shell
