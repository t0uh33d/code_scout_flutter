name: code_scout_talker
description: 'Talker observer for CodeScout. Forwards everything Talker logs to your CodeScout dashboard, without changing a line of your logging code.'
version: 1.0.1
homepage: https://codescout.tech
repository: https://github.com/getcodescout/code_scout_flutter/tree/main/packages/code_scout_talker

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  code_scout: ^1.5.0
  talker: '>=4.0.0 <5.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
