name: code_scout
description: 'Logging and network inspection for Flutter. Structured logs, HTTP capture and an on-device viewer that need no server. Add a self-hosted dashboard when you want one.'
version: 1.2.0
homepage: https://codescout.tech
repository: https://github.com/getcodescout/code_scout_flutter


environment:
  sdk: ^3.11.0
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.3
  archive: ^4.0.9
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  assets:
    - assets/pim.png
