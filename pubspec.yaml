name: code_scout
description: 'Versatile Flutter logger for development and QA. Supports console and socket-based logging, enabling remote monitoring of app behavior, API calls, and analytics without debug connections.'
version: 1.2.0
homepage: https://codescout.tech
repository: https://github.com/t0uh33d/code_scout_flutter


environment:
  sdk: ^3.11.0
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.3
  archive: ^4.0.9
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  assets:
    - assets/pim.png
