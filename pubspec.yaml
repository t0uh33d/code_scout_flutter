name: code_scout
description: 'Logging and network inspection for Flutter, with a self-hosted dashboard. Search logs from every device, watch one live, or read them on the phone with no server at all.'
version: 1.5.0
homepage: https://codescout.tech
repository: https://github.com/getcodescout/code_scout_flutter


environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.3
  archive: ^4.0.9
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  # So the end to end test can answer getTemporaryDirectory(), which is a
  # platform channel and has nothing to answer it on a test host.
  path_provider_platform_interface: ^2.1.2

flutter:
  assets:
    - assets/pim.png
